name: 버그 제보
description: 재현 가능한 오류나 예상과 다른 동작을 알려주세요.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 문제를 빠르게 확인할 수 있도록 아래 내용을 작성해 주세요.

  - type: textarea
    id: summary
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 명확하게 설명해 주세요.
      placeholder: 현재 동작과 문제가 되는 이유를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 최소한의 단계를 순서대로 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 운영체제, 브라우저, 앱 버전, 배포 환경 등 관련 정보를 작성해 주세요.
      placeholder: |
        - OS:
        - 브라우저 또는 런타임:
        - 버전:
        - 환경:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 로그 및 첨부 자료
      description: 관련 로그, 오류 메시지, 스크린샷을 첨부해 주세요. 민감한 정보는 제거해 주세요.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 원인 추정, 임시 해결 방법 등 참고할 내용이 있다면 작성해 주세요.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 같은 문제가 이미 등록되어 있는지 검색했습니다.
          required: true
        - label: 공개하면 안 되는 개인정보와 비밀정보를 제거했습니다.
          required: true
