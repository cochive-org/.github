name: 기능 요청
description: 새로운 기능이나 기존 기능의 개선을 제안해 주세요.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        제안해 주셔서 감사합니다. 해결하려는 문제와 기대 효과를 중심으로 작성해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편이나 제약이 있는지 설명해 주세요.
      placeholder: 어떤 사용자에게, 어떤 상황에서 문제가 발생하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작이나 사용자 경험을 구체적으로 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 다른 해결 방법이나 현재 사용 중인 우회 방법이 있다면 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 기대 효과
      description: 이 기능이 사용자와 프로젝트에 주는 효과를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고 자료, 화면 예시, 관련 이슈 등 도움이 될 내용을 첨부해 주세요.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 비슷한 기능 요청이 이미 등록되어 있는지 검색했습니다.
          required: true
        - label: 특정 구현보다 해결할 문제와 기대 결과를 중심으로 작성했습니다.
          required: true
